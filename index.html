function printInvoice(id){
  const inv=state.invoices.find(i=>i.id===id);if(!inv)return;
  const pr=$('#printRoot'),oldTitle=document.title,s=byId(inv.studentId);
  pr.innerHTML=invoiceHTML(inv);document.body.classList.add('printing');
  document.title=`${inv.number} ${s?s.name:''}`.trim();
  const done=()=>{document.body.classList.remove('printing');pr.innerHTML='';document.title=oldTitle;window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{try{window.print();}catch(e){done();toast('Printing is not available here','err');}},60);
}
function togglePaid(id,fromModal){
  const inv=state.invoices.find(i=>i.id===id);if(!inv)return;
  inv.paid=!inv.paid;inv.paidDate=inv.paid?todayStr():null;save();
  toast(inv.paid?`${inv.number} marked as paid`:`${inv.number} marked unpaid`);
  if(fromModal)showInvoiceModal(inv);
  render();
}
async function copyReminder(sid,m){
  const b=billing(sid,m);
  if(!b.billable.length){toast('No billable lessons in '+monthLabel(m),'err');return;}
  upsertInvoice(sid,m);
  const text=reminderText(sid,m);
  if(await copyText(text))toast('Reminder copied — paste into WhatsApp or SMS');
  else showTextModal('Payment reminder',text);
  if(ui.view==='billing')renderBilling();
}

function exportJSON(){
  const data=JSON.stringify({app:'Magistent',schema:1,exportedAt:new Date().toISOString(),...state},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`magistent-backup-${todayStr()}.json`;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  state.settings.lastBackup=new Date().toISOString();save();
  toast('Backup downloaded');if(ui.view==='settings'||ui.view==='home')render();
}
async function importJSON(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||typeof d!=='object'||!Array.isArray(d.students))throw new Error('This file is not a Magistent backup');
    const nd=normalize(d);
    if(state.students.length||Object.keys(state.sessions).length){
      const ok=await confirmBox({title:'Replace current data?',message:`Your current data (<b>${state.students.length}</b> students) will be replaced by this backup containing <b>${nd.students.length}</b> students, <b>${Object.keys(nd.sessions).length}</b> sessions and <b>${nd.invoices.length}</b> invoices.`,ok:'Import & replace',danger:true});
      if(!ok)return;
    }
    state=nd;save();ui.mapFit=true;closeModal();render();toast(`Imported ${plural(nd.students.length,'student')}`);
  }catch(err){toast(err&&err.message&&!/JSON|Unexpected/i.test(err.message)?err.message:'Could not read that file — is it a valid JSON backup?','err');}
}

    ['Sofia Martinez','Ana Martinez','+1 646 555 0133','420 W 23rd St, New York, NY (Chelsea)',40.7465,-74.0014,[2],'15:30',60,65,'Violin','Intermediate',['Vibrato exercises; Bach Gavotte first page','Shifting to 3rd position — slow and steady','Bow distribution on long notes; scale in D']],
    ['Noah Williams','Karen Williams','+1 718 555 0144','58 Pierrepont St, Brooklyn, NY',40.6960,-73.9933,[3],'18:00',60,80,'Chemistry','AP',['Stoichiometry practice set; limiting reagents','Equilibrium & Le Chatelier — needs review','Unit 5 FRQ practice, timed']],

    ['Mia Rossi','Lucia Rossi','+1 347 555 0177','31-15 Ditmars Blvd, Astoria, NY',40.7746,-73.9097,[3,6],'16:00',90,95,'SAT Prep','Target 1450+',['Reading section timed drill — 31/52','Math: linear models & word problems','Full practice test review; grammar rules','Desmos strategies for hard math']],
    ['Oliver Kim','Grace Kim','+1 212 555 0188','140 E 34th St, New York, NY (Murray Hill)',40.7466,-73.9794,[4],'18:30',60,60,'French','A2',['Passé composé with être; dialogue practice','Listening comprehension — café scene','Vocabulary: travel & directions']],
    ['Zoe Adler','Ruth Adler','+1 917 555 0199','Online lessons (Zoom)',null,null,[5],'19:00',60,65,'Geometry','Grade 9',['Proofs with congruent triangles','Circle theorems — homework set 3']],
    ['Lucas Green','Helen Green','+1 646 555 0110','2280 Frederick Douglass Blvd, New York, NY (Harlem)',40.8116,-73.9530,[4],'15:00',60,70,'Physics','Regents',['Kinematics graphs','Newton’s laws problem set']]
  ];
  const pools={};
  spec.forEach((r,i)=>{

    state.students.push(s);pools[s.id]=r[12];

      if(!s.days.includes(d.getDay()))continue;

      inv.paid=off===-2||rnd()<0.6;
      inv.paidDate=inv.paid?ymd(addDays(parseYmd(inv.issueDate),3+Math.floor(rnd()*5))):null;
    });
  });
  save();
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
async function onClick(e){
  if(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-modal-back')){if(downOnBack)closeModal();return;}
  const el=e.target.closest&&e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'nav':closeModal();go(el.dataset.view);break;
    case 'collapse':ui.collapsed=!ui.collapsed;$('#app').classList.toggle('collapsed',ui.collapsed);saveUI();setTimeout(()=>{if(map)map.invalidateSize();},300);break;
    case 'close-modal':closeModal();break;
    case 'fab':if(ui.view==='students')studentForm();else openSession({free:true,date:todayStr()});break;
    case 'add-student':closeModal();studentForm();break;
    case 'edit-student':closeModal();studentForm(id);break;
    case 'view-student':viewStudent(id);break;
    case 'archive-student':{const s=byId(id);if(!s)break;s.archived=true;save();render();toast(`${s.name} archived`,'ok',{label:'Undo',fn:()=>{s.archived=false;save();render();}});break;}
    case 'restore-student':{const s=byId(id);if(!s)break;s.archived=false;save();render();toast(`${s.name} restored to the roster`);break;}
    case 'delete-student':{
      const s=byId(id);if(!s)break;
      const ns=Object.values(state.sessions).filter(x=>x.studentId===id).length,ni=state.invoices.filter(i=>i.studentId===id).length;
      const ok=await confirmBox({title:'Delete permanently?',message:`<b>${esc(s.name)}</b>, ${plural(ns,'logged session')} and ${plural(ni,'invoice')} will be removed. This cannot be undone.`,ok:'Delete student',danger:true});
      if(!ok)break;
      state.students=state.students.filter(x=>x.id!==id);
      Object.keys(state.sessions).forEach(k=>{if(state.sessions[k].studentId===id)delete state.sessions[k];});
      state.invoices=state.invoices.filter(i=>i.studentId!==id);
      save();render();toast('Student deleted');break;}
    case 'sfilter':ui.sf=el.dataset.f;renderStudents();break;
    case 'log-lesson':openSession({free:true,sid:el.dataset.sid||'',date:el.dataset.date||todayStr()});break;
    case 'session':openSession({sid:el.dataset.sid,date:el.dataset.date});break;
    case 'mark':{
      const sid=el.dataset.sid,date=el.dataset.date,s=byId(sid);if(!s)break;
      const res=setStatus(sid,date,el.dataset.status);
      if(navigator.vibrate)try{navigator.vibrate(8);}catch(_){}
      afterChange();
      if(res==='rescheduled')toast(`${s.name} · rescheduled`,'ok',{label:'Pick new date',fn:()=>openSession({sid,date,status:'rescheduled'})});
      break;}
    case 'week':{const d=Number(el.dataset.d);ui.weekStart=d===0?ymd(mondayOf(new Date())):ymd(addDays(parseYmd(ui.weekStart),7*d));renderSchedule();break;}
    case 'map-day':ui.mapDay=el.dataset.day;ui.mapFit=true;saveUI();if(map)map.closePopup();renderMap();break;
    case 'fly':{
      const s=byId(id);if(!s||!hasLoc(s)||!mapReady)break;
      if(!markers.has(id)){ui.mapDay='all';ui.mapFit=false;renderMap();}
      map.setView([s.lat,s.lng],Math.max(map.getZoom(),15));
      const m=markers.get(id);if(m)setTimeout(()=>m.openPopup(),200);
      if(isMobile())$('.map-wrap').scrollIntoView({behavior:'smooth',block:'start'});
      break;}
    case 'pick-home':ui.pickHome=!ui.pickHome;$('#view-map').classList.toggle('picking',ui.pickHome);renderMapPanel();if(ui.pickHome)toast('Click anywhere on the map to set your home base');break;
    case 'month':{const d=Number(el.dataset.d);ui.month=d===0?ymOf(new Date()):shiftMonth(ui.month,d);render();break;}
    case 'month-set':ui.month=el.dataset.m;render();break;
    case 'invoice':openInvoice(el.dataset.sid,el.dataset.m);break;
    case 'view-invoice':{const inv=state.invoices.find(i=>i.id===id);if(inv)showInvoiceModal(inv);break;}
    case 'toggle-paid':togglePaid(id,el.dataset.modal==='1');break;
    case 'print-invoice':printInvoice(id);break;
    case 'delete-invoice':{
      const inv=state.invoices.find(i=>i.id===id);if(!inv)break;
      const ok=await confirmBox({title:'Delete invoice?',message:`Invoice <b>${esc(inv.number)}</b> will be removed. Session records are not affected and you can issue a new invoice any time.`,ok:'Delete invoice',danger:true});
      if(!ok)break;state.invoices=state.invoices.filter(i=>i.id!==id);save();render();toast('Invoice deleted');break;}
    case 'copy-reminder':copyReminder(el.dataset.sid,el.dataset.m);break;
    case 'export':exportJSON();break;
    case 'import':$('#importFile').click();break;
    case 'load-demo':{
      if(state.students.length){const ok=await confirmBox({title:'Load sample roster?',message:'Your current data will be replaced by a sample roster of 10 students with 11 weeks of sessions and invoices. Export a backup first if you want to keep it.',ok:'Replace with sample',danger:true});if(!ok)break;}
      loadDemo();ui.mapFit=true;ui.mapDay='all';ui.month=ymOf(new Date());closeModal();render();toast('Sample roster loaded — explore every tab');break;}
    case 'erase':{
      const ok=await confirmBox({title:'Erase all data?',message:'All students, sessions, invoices and settings stored in this browser will be permanently deleted.',ok:'Erase everything',danger:true});
      if(!ok)break;state=defaults();save();ui.mapFit=true;closeModal();render();toast('All data erased');break;}
    case 'reset-template':{const f=$('#setForm');if(f){f.elements.namedItem('reminderTemplate').value=DEFAULT_REMINDER;f.elements.namedItem('paymentTerms').value=DEFAULT_TERMS;toast('Default texts restored — click Save to keep them');}break;}
    case 'backup-dismiss':ui.backupDismissed=true;renderHome();break;
    case 'geocode':geocode(el);break;
    case 'geolocate':geolocate(el);break;
    case 'clear-pin':clearPin();break;
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  buildNav();
  if(ui.collapsed)$('#app').classList.add('collapsed');
  // Capture phase so actions inside Leaflet popups (which stop propagation) still work.
  document.addEventListener('click',onClick,true);
  document.addEventListener('mousedown',e=>{downOnBack=!!(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-modal-back'));},true);
  document.addEventListener('touchstart',e=>{downOnBack=!!(e.target&&e.target.hasAttribute&&e.target.hasAttribute('data-modal-back'));},{capture:true,passive:true});
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if(modalOpen())closeModal();
    else if(ui.pickHome){ui.pickHome=false;$('#view-map').classList.remove('picking');renderMapPanel();}
  });
  $('#importFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importJSON(f);});
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(map&&ui.view==='map')map.invalidateSize();},150);});
  window.addEventListener('storage',e=>{if(e.key===STORE_KEY&&!modalOpen()){state=load();ui.mapFit=true;render();toast('Data updated from another tab');}});
  // Keep "today", "next lesson" and the home dashboard fresh while the app stays open.
  let lastDay=todayStr();
  setInterval(()=>{
    const d=todayStr();
    if(d!==lastDay){lastDay=d;ui.weekStart=ymd(mondayOf(new Date()));if(!modalOpen())render();}
    else if(ui.view==='home'&&!modalOpen()&&!document.hidden)renderHome();
  },5*60*1000);
  renderStorageWarn();
  go(ui.view);
}
init();
})();
